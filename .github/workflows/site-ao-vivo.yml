# Camada 3: confere o site NO AR depois de cada publicação (merge na main) e toda madrugada.
# Se algo quebrar, abre (ou atualiza) uma issue "Site no ar com problema"; quando volta ao normal, fecha.
name: Site no ar

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * *' # 04:17 em Brasília
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: site-ao-vivo
  cancel-in-progress: false

jobs:
  ao-vivo:
    name: "3 · Site no ar (redirects, cabeçalhos, robôs, prévias)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Esperar o Cloudflare publicar
        if: github.event_name == 'push'
        run: sleep 180
      - name: Conferir o site no ar
        id: teste
        run: |
          set -o pipefail
          node tests/ao-vivo.mjs 2>&1 | tee resultado.txt
      - name: Abrir ou atualizar issue quando quebrar
        if: failure() && steps.teste.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const saida = fs.readFileSync('resultado.txt', 'utf8');
            const relatorio = saida.slice(saida.indexOf('=== Camada 3'));
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const titulo = 'Site no ar com problema (esteira)';
            const corpo = `A verificação do site no ar falhou em ${new Date().toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' })}.\n\nExecução: ${run}\n\n\`\`\`\n${relatorio.slice(0, 60000)}\n\`\`\`\n\nComo rodar de novo: Actions → "Site no ar" → Run workflow. Esta issue fecha sozinha quando a verificação voltar a passar.`;
            const { data: abertas } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'site-ao-vivo' });
            if (abertas.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: abertas[0].number, body: corpo });
            } else {
              await github.rest.issues.create({ ...context.repo, title: titulo, body: corpo, labels: ['site-ao-vivo'] });
            }
      - name: Fechar issue quando voltar ao normal
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: abertas } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'site-ao-vivo' });
            for (const i of abertas) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: 'A verificação do site no ar voltou a passar. Fechando.' });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
            }
